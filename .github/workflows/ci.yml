# El realm vive repartido en nueve repositorios, asi que este CI se los trae todos: comprobar solo
# los ficheros de este no dice nada sobre si el conjunto encaja. Los nueve son publicos, de modo
# que el checkout cruzado no necesita ningun token.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  # Un cambio de roles en cualquiera de los servicios puede romper el ensamblado sin tocar
  # este repositorio, y aqui no llega ningun evento de aquellos: de ahi la pasada semanal.
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  realm:
    name: Realm y composes
    runs-on: ubuntu-latest

    steps:
      - name: Check out mto-platform
        uses: actions/checkout@v5
        with:
          path: mto-platform

      # El realm se ensambla desde los nueve repositorios, asi que un cambio coordinado vive en la
      # misma rama en todos. Se usa esa rama en cada hermano si existe y la de por defecto si
      # no: sin esto, un PR que anade una importacion parcial se comprueba contra un master que
      # todavia no la tiene, y falla siempre.
      - name: Resolve sibling branches
        id: refs
        run: |
          set -euo pipefail
          branch="${{ github.head_ref || github.ref_name }}"
          for repo in notification configuration stock gateway maintenance users backoffice field resources; do
            if git ls-remote --exit-code --heads \
                 "https://github.com/alexwarrior1991/mto-$repo" "$branch" >/dev/null 2>&1; then
              echo "${repo}_ref=$branch" >> "$GITHUB_OUTPUT"
              echo "mto-$repo: $branch"
            else
              echo "${repo}_ref=master" >> "$GITHUB_OUTPUT"
              echo "mto-$repo: master (no tiene la rama $branch)"
            fi
          done

      - name: Check out mto-notification
        uses: actions/checkout@v5
        with:
          repository: alexwarrior1991/mto-notification
          ref: ${{ steps.refs.outputs.notification_ref }}
          path: mto-notification

      - name: Check out mto-configuration
        uses: actions/checkout@v5
        with:
          repository: alexwarrior1991/mto-configuration
          ref: ${{ steps.refs.outputs.configuration_ref }}
          path: mto-configuration

      - name: Check out mto-stock
        uses: actions/checkout@v5
        with:
          repository: alexwarrior1991/mto-stock
          ref: ${{ steps.refs.outputs.stock_ref }}
          path: mto-stock

      - name: Check out mto-gateway
        uses: actions/checkout@v5
        with:
          repository: alexwarrior1991/mto-gateway
          ref: ${{ steps.refs.outputs.gateway_ref }}
          path: mto-gateway

      - name: Check out mto-maintenance
        uses: actions/checkout@v5
        with:
          repository: alexwarrior1991/mto-maintenance
          ref: ${{ steps.refs.outputs.maintenance_ref }}
          path: mto-maintenance

      - name: Check out mto-users
        uses: actions/checkout@v5
        with:
          repository: alexwarrior1991/mto-users
          ref: ${{ steps.refs.outputs.users_ref }}
          path: mto-users

      - name: Check out mto-backoffice
        uses: actions/checkout@v5
        with:
          repository: alexwarrior1991/mto-backoffice
          ref: ${{ steps.refs.outputs.backoffice_ref }}
          path: mto-backoffice

      - name: Check out mto-field
        uses: actions/checkout@v5
        with:
          repository: alexwarrior1991/mto-field
          ref: ${{ steps.refs.outputs.field_ref }}
          path: mto-field

      - name: Check out mto-resources
        uses: actions/checkout@v5
        with:
          repository: alexwarrior1991/mto-resources
          ref: ${{ steps.refs.outputs.resources_ref }}
          path: mto-resources

      # Sustituye a RealmDefinitionsTest, que vivia en mto-configuration y solo veia los ficheros de
      # ese repositorio. Sin dependencias: aqui no hay Maven.
      - name: Check realm consistency
        working-directory: mto-platform
        run: python3 scripts/check_realm_consistency.py --repos ..

      # Valida sintaxis, interpolacion de variables y perfiles. No levanta nada.
      - name: Validate compose
        working-directory: mto-platform
        run: |
          cp .env.example .env
          docker compose config -q
          docker compose --profile all config -q

      # Que el fichero parsee no dice que los perfiles seleccionen lo que deben: un 'profiles:' mal
      # puesto en la infraestructura la dejaria fuera de un 'up' sin perfil y el fallo apareceria
      # como un servicio que no arranca, no como un error de compose.
      - name: Check compose profiles
        working-directory: mto-platform
        run: |
          set -euo pipefail
          # Cada lista se lee UNA vez y se comprueba sobre la variable, nunca con
          # 'docker compose ... | grep -q': grep cierra la tuberia en cuanto encuentra la linea
          # y, si compose aun tenia lineas que escribir, muere por SIGPIPE; con pipefail la
          # tuberia entera queda en error y la comprobacion fallaba al azar con "no arranca
          # sin perfil" sobre un compose correcto.
          sin_perfil=$(docker compose config --services)
          infra="jaeger keycloak mailpit postgres rabbitmq redis"
          for esperado in $infra; do
            if ! grep -qx "$esperado" <<<"$sin_perfil"; then
              echo "La infraestructura '$esperado' no arranca sin perfil"; exit 1
            fi
          done
          for app in configuration stock gateway maintenance users notification field resources backoffice frontend; do
            if grep -qx "$app" <<<"$sin_perfil"; then
              echo "La aplicacion '$app' arranca sin pedir su perfil"; exit 1
            fi
            con_perfil=$(docker compose --profile "$app" config --services)
            if ! grep -qx "$app" <<<"$con_perfil"; then
              echo "El perfil '$app' no incluye su aplicacion"; exit 1
            fi
          done
          echo "Perfiles correctos"

      - name: Check the scripts
        working-directory: mto-platform
        run: |
          bash -n keycloak/apply-partials.sh
          bash -n scripts/e2e.sh
          bash -n deploy/gitops/scripts/render.sh
          sudo apt-get install -y --no-install-recommends shellcheck >/dev/null 2>&1 || true
          command -v shellcheck >/dev/null && shellcheck keycloak/apply-partials.sh scripts/e2e.sh deploy/gitops/scripts/render.sh || true

      # Lo de arriba lee los ficheros; lo que Keycloak hace con ellos solo se ve aplicandolos. Una
      # importacion parcial con OVERWRITE sustituye el cliente entero, y los ficheros de desarrollo
      # dejaban asi al backoffice sin redirect URI y a las cuentas de servicio sin su audiencia sin
      # que ninguna comprobacion estatica lo viera. Aqui se ensambla el realm sobre el Keycloak del
      # compose (el .env lo dejo 'Validate compose') y se comprueba con que se queda.
      - name: Start Keycloak
        working-directory: mto-platform
        run: docker compose up -d --wait --wait-timeout 300 keycloak

      - name: Assemble the realm on Keycloak
        working-directory: mto-platform
        run: ./keycloak/apply-partials.sh

      - name: Check the assembled realm
        working-directory: mto-platform
        run: python3 scripts/check_applied_realm.py --repos ..

      # El camino de un entorno desplegado (deploy/, el chart mto-realm): otro Keycloak, limpio, sin los
      # ficheros de desarrollo; el realm montado por build_realm_import.py con unos secretos y unas URLs de
      # prueba, aplicado por keycloak-config-cli como lo hace el Job, dos veces (la segunda no cambia nada), y
      # comprobado con check_applied_realm.py --no-dev-users --overrides, como el Job que va despues.
      - name: Start a clean Keycloak for the deployed realm
        run: |
          docker run -d --name keycloak-deploy -p 18082:8080 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin \
            quay.io/keycloak/keycloak:26.1 start-dev
          for _ in $(seq 1 90); do
            curl -sf http://localhost:18082/realms/master >/dev/null && exit 0
            sleep 2
          done
          echo "Keycloak no arranco"; exit 1

      - name: Build the deployed realm
        working-directory: mto-platform
        run: |
          for client in NOTIFICATION_SVC CONFIGURATION_SVC RESOURCES_SVC TELEMATICS_SVC MAINTENANCE_SVC \
                        USERS_SVC FIELD_SVC BACKOFFICE METRICS_SVC; do
            export "KC_CLIENT_SECRET_MTO_${client}=ci-${client}-$(openssl rand -hex 8)"
          done
          export KC_SMTP_PASSWORD=ci-smtp
          python3 deploy/keycloak/build_realm_import.py --repos .. \
            --overrides deploy/keycloak/overrides.example.json --output "$RUNNER_TEMP/realm/realm-mto.json"
          chmod -R a+rX "$RUNNER_TEMP/realm"

      - name: Apply it with keycloak-config-cli, twice
        run: |
          managed=()
          for kind in CLIENT ROLE GROUP CLIENT_SCOPE COMPONENT SUB_COMPONENT REQUIRED_ACTION AUTHENTICATION_FLOW \
                      IDENTITY_PROVIDER IDENTITY_PROVIDER_MAPPER CLIENT_SCOPE_MAPPING SCOPE_MAPPING; do
            managed+=(-e "IMPORT_MANAGED_${kind}=no-delete")
          done
          for _ in 1 2; do
            docker run --rm --network host -v "$RUNNER_TEMP/realm:/work/import:ro" \
              -e KEYCLOAK_URL=http://localhost:18082 -e KEYCLOAK_USER=admin -e KEYCLOAK_PASSWORD=admin \
              -e KEYCLOAK_AVAILABILITYCHECK_ENABLED=true -e KEYCLOAK_AVAILABILITYCHECK_TIMEOUT=300s \
              -e IMPORT_FILES_LOCATIONS=file:/work/import/realm-mto.json "${managed[@]}" \
              adorsys/keycloak-config-cli:6.4.0-26
          done

      - name: Check the deployed realm
        working-directory: mto-platform
        env:
          KC_URL: http://localhost:18082
          KC_BOOTSTRAP_ADMIN_USERNAME: admin
          KC_BOOTSTRAP_ADMIN_PASSWORD: admin
        run: |
          python3 scripts/check_applied_realm.py --repos .. --no-dev-users \
            --overrides deploy/keycloak/overrides.example.json

      - name: Keycloak log
        if: failure()
        working-directory: mto-platform
        run: |
          docker compose logs --no-color --tail 200 keycloak
          docker logs --tail 200 keycloak-deploy || true

  # deploy/: los charts de Argo CD y el playbook de Ansible. Sin cluster: helm lint y helm template de cada
  # Application de los dos entornos tal como las renderizaria Argo CD (deploy/gitops/scripts/render.sh),
  # kubeconform sobre el resultado (los CRD de los operadores, del catalogo de datree; la Route, de
  # deploy/gitops/schemas), y ansible-lint y --syntax-check del playbook.
  deploy:
    name: Despliegue en OpenShift (charts y playbook)
    runs-on: ubuntu-latest

    steps:
      - name: Check out mto-platform
        uses: actions/checkout@v5

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.19.0

      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C "$RUNNER_TEMP" kubeconform
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Lint the charts
        working-directory: deploy/gitops
        run: |
          helm lint apps -f apps/values-staging.yaml
          helm lint apps -f apps/values-prod.yaml
          helm lint charts/mto-infra -f values/staging/common.yaml -f values/staging/infra.yaml
          helm lint charts/mto-realm -f values/base/realm.yaml -f values/staging/common.yaml
          helm lint charts/mto-service -f values/base/spring.yaml -f values/base/rabbitmq.yaml \
            -f values/base/field.yaml -f values/staging/common.yaml

      - name: Render both environments as Argo CD would
        run: |
          deploy/gitops/scripts/render.sh staging "$RUNNER_TEMP/render/staging"
          deploy/gitops/scripts/render.sh prod "$RUNNER_TEMP/render/prod"

      - name: Validate the manifests
        run: |
          kubeconform -strict -summary -kubernetes-version 1.31.0 \
            -schema-location default \
            -schema-location 'deploy/gitops/schemas/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            "$RUNNER_TEMP"/render/*/*.yaml

      # La regla del backoffice: su cookie de afinidad no existe con TLS passthrough, y el chart lo rechaza.
      - name: A cookie route cannot be passthrough
        working-directory: deploy/gitops
        run: |
          if helm template x charts/mto-service --set name=mto-x --set image.repository=x \
               --set route.enabled=true --set route.cookieName=x --set route.tls.termination=passthrough >/dev/null 2>&1; then
            echo "El chart acepto una Route passthrough con cookie de afinidad"; exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # redhat.openshift es la coleccion certificada de Red Hat y su version 4 esta en Automation Hub, que pide
      # un token; Galaxy no la tiene como estable. Es community.okd con otro nombre (el mismo openshift_auth), asi
      # que el playbook se comprueba con community.okd de Galaxy instalada como redhat.openshift.
      - name: Install Ansible
        working-directory: deploy/ansible
        run: |
          pip install -r requirements.txt ansible-lint
          ansible-galaxy collection install kubernetes.core community.okd -p collections
          mkdir -p collections/ansible_collections/redhat
          ln -s ../community/okd collections/ansible_collections/redhat/openshift

      # --offline: sin el, ansible-lint vuelve a instalar requirements.yml, y redhat.openshift no esta en Galaxy.
      - name: Check the playbook
        working-directory: deploy/ansible
        run: |
          ansible-playbook -i inventories/staging site.yml --syntax-check
          ansible-playbook -i inventories/prod site.yml --syntax-check
          ansible-lint --offline site.yml roles

  # Las pruebas de punta a punta de mto-frontend (e2e/) contra la plataforma entera, con los dos
  # frontales: lo que se ve en una pantalla de verdad, el SSO compartido y el enlace entre las dos
  # aplicaciones. scripts/e2e.sh trae los hermanos que falten (en la misma rama si la tienen, como
  # arriba) y usa la imagen publicada de cada commit o la construye. Lo llaman tambien los CI de
  # mto-frontend y de mto-backoffice, asi que un cambio coordinado se prueba junto en los tres.
  e2e:
    name: E2E de los dos frontales
    needs: realm
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out mto-platform
        uses: actions/checkout@v5
        with:
          path: mto-platform

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Run the end-to-end tests
        working-directory: mto-platform
        run: scripts/e2e.sh

      - name: Upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: e2e-report
          path: |
            mto-frontend/playwright-report/
            mto-frontend/test-results/
            mto-platform/e2e-output/
          if-no-files-found: ignore
          retention-days: 7
