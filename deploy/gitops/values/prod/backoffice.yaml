# La imagen de produccion de mto-backoffice: el sha-<commit> que publico su CI (ghcr.io/alexwarrior1991/mto-backoffice) y que
# ya paso por staging. Vacia, o latest, el chart no renderiza (deploy/README.md, Promover a produccion).
image:
  tag: ""
# Mas replicas no reparten mejor: cada sesion vive en su pod. Las justas para no perder el servicio en un
# despliegue o en un drenado de nodo (PDB).
hpa:
  minReplicas: 2
  maxReplicas: 3
