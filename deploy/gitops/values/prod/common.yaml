# Lo que es de produccion y comparten todas sus Applications. Los nombres de host son de ejemplo.
global:
  environment: prod
  appsDomain: apps.example.com
  keycloakUrl: https://mto-auth.apps.example.com
  frontendUrl: https://mto.apps.example.com
  backofficeUrl: https://mto-backoffice.apps.example.com
  tracing:
    enabled: false
    endpoint: ""
  mail:
    host: smtp.example.com
    port: "587"
    from: notificaciones@example.com
    auth: "true"
    starttls: "true"
    user: mto-notificaciones

# Produccion no sigue latest: aqui no hay etiqueta. Cada servicio lleva la suya en su fichero de este
# directorio (image.tag: el sha-<commit> que publico su CI y ya paso por staging), y el chart no renderiza
# el que no la tenga o diga latest (deploy/README.md, Promover a produccion).
image:
  pullPolicy: IfNotPresent
# El maximo cuenta en las conexiones a PostgreSQL (postgres.parameters.max_connections de mto-infra).
hpa:
  minReplicas: 2
  maxReplicas: 4
