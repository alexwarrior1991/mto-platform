{{- if .Values.redis.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.redis.name }}
  labels:
    {{- include "mto-infra.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ .Values.redis.name }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  replicas: 1
  # Una sola cache: nunca dos a la vez, ni durante un despliegue.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.redis.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.redis.name }}
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.redis.passwordSecret }}
                  key: password
          # Lo mismo que el redis de compose.yaml: allkeys-lru, porque con noeviction un Redis lleno
          # rechaza las escrituras y la cache deja de cachear; sin disco, porque es una cache.
          command:
            - redis-server
            - --requirepass
            - $(REDIS_PASSWORD)
            - --maxmemory
            - {{ .Values.redis.maxmemory | quote }}
            - --maxmemory-policy
            - allkeys-lru
            - --appendonly
            - "no"
            - --save
            - ""
            - --dir
            - /tmp
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            tcpSocket:
              port: redis
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: redis
            periodSeconds: 10
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.redis.name }}
  labels:
    {{- include "mto-infra.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ .Values.redis.name }}
  ports:
    - name: redis
      port: 6379
      targetPort: redis
{{- end }}
