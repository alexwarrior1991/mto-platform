# El usuario de PostgreSQL de cada base (el de 01-databases.sql y values/base de cada servicio). La contrasena,
# del vault (vault_db_passwords).
secrets_db_users:
  configuration: mto_configuration_user
  stock: mto_stock_user
  maintenance: mto_maintenance_user
  notification: mto_notification_user
  field: mto_field_user
  resources: mto_resources_user
  keycloak: keycloak

# Los clientes confidenciales del realm cuyo secreto pone el Job del realm (build_realm_import.py falla si
# falta uno).
secrets_keycloak_clients:
  - MTO_CONFIGURATION_SVC
  - MTO_MAINTENANCE_SVC
  - MTO_USERS_SVC
  - MTO_NOTIFICATION_SVC
  - MTO_RESOURCES_SVC
  - MTO_TELEMATICS_SVC
  - MTO_FIELD_SVC
  - MTO_METRICS_SVC
  - MTO_BACKOFFICE
