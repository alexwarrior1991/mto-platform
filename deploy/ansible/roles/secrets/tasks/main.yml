# Los secretos del entorno, del vault al proyecto. Ninguna tarea los registra (no_log), y nada de esto esta en
# Git: los charts solo nombran los Secret y sus claves. Volver a ejecutarlo con otro valor lo cambia (las
# contrasenas de PostgreSQL las vuelve a aplicar CloudNativePG por la etiqueta cnpg.io/reload; un servicio
# lee la nueva al reiniciarse, y el realm la del cliente en la siguiente sincronizacion de mto-realm).
- name: Comprobar que el vault trae todo
  ansible.builtin.assert:
    that:
      - vault_db_passwords[item] | default('') | length >= 16
    fail_msg: "Falta la contrasena de PostgreSQL de {{ item }} (vault_db_passwords.{{ item }}, 16 caracteres o mas)"
    quiet: true
  loop: "{{ secrets_db_users.keys() | list }}"
  no_log: true

- name: Comprobar que el vault trae los secretos de los clientes de Keycloak
  ansible.builtin.assert:
    that:
      - vault_keycloak_client_secrets[item] | default('') | length >= 16
    fail_msg: "Falta el secreto del cliente {{ item }} (vault_keycloak_client_secrets.{{ item }}, 16 caracteres o mas)"
    quiet: true
  loop: "{{ secrets_keycloak_clients }}"
  no_log: true

- name: Comprobar los demas secretos del vault
  ansible.builtin.assert:
    that:
      - vault_redis_password | default('') | length >= 16
      - vault_messaging_signature_secret | default('') | length >= 32
      - vault_keycloak_admin_username | default('') | length > 0
      - vault_keycloak_admin_password | default('') | length >= 16
    fail_msg: "Al vault le falta la contrasena de Redis, la firma de los mensajes (32 o mas) o el administrador de Keycloak"
    quiet: true
  no_log: true

- name: Crear el usuario de cada base de datos
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      type: kubernetes.io/basic-auth
      metadata:
        name: "mto-db-{{ item.key }}"
        namespace: "{{ mto_namespace }}"
        labels:
          app.kubernetes.io/part-of: mto
          # CloudNativePG vuelve a poner la contrasena del rol cuando cambia.
          cnpg.io/reload: "true"
      stringData:
        username: "{{ item.value }}"
        password: "{{ vault_db_passwords[item.key] }}"
  loop: "{{ secrets_db_users | dict2items }}"
  no_log: true

- name: Crear la contrasena de Redis
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: mto-redis
        namespace: "{{ mto_namespace }}"
        labels:
          app.kubernetes.io/part-of: mto
      stringData:
        password: "{{ vault_redis_password }}"
  no_log: true

- name: Crear la firma de los mensajes
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: mto-messaging
        namespace: "{{ mto_namespace }}"
        labels:
          app.kubernetes.io/part-of: mto
      stringData:
        signature-secret: "{{ vault_messaging_signature_secret }}"
  no_log: true

- name: Crear el administrador de arranque de Keycloak
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: mto-keycloak-admin
        namespace: "{{ mto_namespace }}"
        labels:
          app.kubernetes.io/part-of: mto
      stringData:
        username: "{{ vault_keycloak_admin_username }}"
        password: "{{ vault_keycloak_admin_password }}"
  no_log: true

# Una clave por cliente con el nombre que espera build_realm_import.py (KC_CLIENT_SECRET_<CLIENTID>), mas la
# contrasena del SMTP de Keycloak: el Job del realm lo carga entero como variables, y cada servicio lee la suya.
- name: Crear los secretos de los clientes de Keycloak
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: mto-keycloak-client-secrets
        namespace: "{{ mto_namespace }}"
        labels:
          app.kubernetes.io/part-of: mto
      stringData: >-
        {{ dict(secrets_keycloak_clients | map('regex_replace', '^', 'KC_CLIENT_SECRET_')
                | zip(secrets_keycloak_clients | map('extract', vault_keycloak_client_secrets)))
           | combine({'KC_SMTP_PASSWORD': vault_smtp_password | default('')}) }}
  no_log: true

- name: Crear el usuario del SMTP
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: mto-smtp
        namespace: "{{ mto_namespace }}"
        labels:
          app.kubernetes.io/part-of: mto
      stringData:
        username: "{{ vault_smtp_username | default('') }}"
        password: "{{ vault_smtp_password | default('') }}"
  no_log: true

- name: Crear el token de Git del Job del realm
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: mto-git
        namespace: "{{ mto_namespace }}"
        labels:
          app.kubernetes.io/part-of: mto
      stringData:
        token: "{{ vault_git_token }}"
  when: vault_git_token | default('') | length > 0
  no_log: true
