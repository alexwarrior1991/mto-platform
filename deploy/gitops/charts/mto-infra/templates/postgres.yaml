apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Values.postgres.name }}
  labels:
    {{- include "mto-infra.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    # Los datos de todo el entorno: Argo CD no lo borra aunque se quite de Git.
    argocd.argoproj.io/sync-options: Delete=false
spec:
  instances: {{ .Values.postgres.instances }}
  imageName: {{ .Values.postgres.imageName }}
  storage:
    size: {{ .Values.postgres.storage.size }}
    {{- with .Values.postgres.storage.storageClass }}
    storageClass: {{ . }}
    {{- end }}
  resources:
    {{- toYaml .Values.postgres.resources | nindent 4 }}
  postgresql:
    parameters:
      {{- toYaml .Values.postgres.parameters | nindent 6 }}
  # Un rol con login por servicio, con la contrasena de su Secret basic-auth (CNPG la vuelve a poner
  # si el Secret cambia y lleva la etiqueta cnpg.io/reload, que le pone Ansible).
  managed:
    roles:
      {{- range .Values.postgres.databases }}
      - name: {{ .owner }}
        ensure: present
        login: true
        passwordSecret:
          name: {{ .secret }}
      {{- end }}
{{- range .Values.postgres.databases }}
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: {{ $.Values.postgres.name }}-{{ .name | replace "_" "-" }}
  labels:
    {{- include "mto-infra.labels" $ | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: Delete=false
spec:
  cluster:
    name: {{ $.Values.postgres.name }}
  name: {{ .name }}
  owner: {{ .owner }}
  ensure: present
  # Quitar el recurso no borra la base.
  databaseReclaimPolicy: retain
{{- end }}
