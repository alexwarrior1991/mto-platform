# Infraestructura compartida del dominio MTO y las aplicaciones que la usan.
#
# La infraestructura no lleva 'profiles:', asi que arranca siempre. Cada aplicacion lleva
# 'profiles: [all, <nombre>]', de modo que:
#
#   docker compose --profile all up -d                              # todo
#   docker compose up -d                                            # solo infraestructura
#   docker compose --profile stock up -d                            # infraestructura + mto-stock
#   docker compose --profile stock --profile maintenance up -d      # mto-maintenance y el stock al que llama
#   docker compose --profile configuration --profile gateway up -d  # dos de seis
#   docker compose --profile backoffice --profile gateway up -d      # el backoffice y el gateway al que llama
#   docker compose --profile frontend --profile gateway up -d        # la SPA y el gateway al que llama
#   docker compose --profile notification up -d                     # el registro de actividad y las notificaciones
#   docker compose --profile maintenance --profile field up -d     # la consola en directo del bloqueo de via (gRPC) y el mantenimiento al que llama
#
# El caso habitual de desarrollo es levantar todo, parar el servicio que se va a tocar y
# arrancarlo desde el IDE contra esta misma infraestructura. Por eso Keycloak y el colector OTLP
# se alcanzan por el HOST con un nombre estable (auth.mto.local / otel.mto.local) y no por el
# nombre del servicio de compose: la URL es la misma se ejecute el servicio dentro o fuera de aqui.
#
# Un solo broker para todas las aplicaciones. Cuando cada repositorio levantaba el suyo,
# mto-configuration publicaba en uno y mto-stock escuchaba en otro: los mensajes no llegaban y
# nada daba error. Es el motivo principal de que exista este fichero.
name: mto-platform

services:

  # ---------------------------------------------------------------------------------------------
  # Infraestructura. Sin 'profiles': arranca siempre.
  # ---------------------------------------------------------------------------------------------

  # Un unico servidor para las cinco bases de datos. Los usuarios y las bases los crea
  # postgres/init/01-databases.sql, que el contenedor ejecuta en la PRIMERA inicializacion.
  postgres:
    image: postgres:17-alpine
    container_name: mto-postgres
    restart: unless-stopped
    environment:
      # Base y superusuario del propio contenedor. Las de las aplicaciones son otras, y las crea
      # el script de init: ninguna aplicacion se conecta con este usuario.
      POSTGRES_DB: ${POSTGRES_DB:-mto}
      POSTGRES_USER: ${POSTGRES_USER:-mto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta en .env, copiese .env.example}
      MTO_CONFIGURATION_DB: ${MTO_CONFIGURATION_DB:-mto_configuration_db}
      MTO_CONFIGURATION_USER: ${MTO_CONFIGURATION_USER:-mto_configuration_user}
      MTO_CONFIGURATION_PASSWORD: ${MTO_CONFIGURATION_PASSWORD:?falta en .env, copiese .env.example}
      MTO_CONFIGURATION_SCHEMA: ${MTO_CONFIGURATION_SCHEMA:-mto_configuration}
      MTO_STOCK_DB: ${MTO_STOCK_DB:-mto_stock}
      MTO_STOCK_USER: ${MTO_STOCK_USER:-mto_stock_user}
      MTO_STOCK_PASSWORD: ${MTO_STOCK_PASSWORD:?falta en .env, copiese .env.example}
      MTO_MAINTENANCE_DB: ${MTO_MAINTENANCE_DB:-mto_maintenance}
      MTO_MAINTENANCE_USER: ${MTO_MAINTENANCE_USER:-mto_maintenance_user}
      MTO_MAINTENANCE_PASSWORD: ${MTO_MAINTENANCE_PASSWORD:?falta en .env, copiese .env.example}
      MTO_NOTIFICATION_DB: ${MTO_NOTIFICATION_DB:-mto_notification}
      MTO_NOTIFICATION_USER: ${MTO_NOTIFICATION_USER:-mto_notification_user}
      MTO_NOTIFICATION_PASSWORD: ${MTO_NOTIFICATION_PASSWORD:?falta en .env, copiese .env.example}
      MTO_FIELD_DB: ${MTO_FIELD_DB:-mto_field}
      MTO_FIELD_USER: ${MTO_FIELD_USER:-mto_field_user}
      MTO_FIELD_PASSWORD: ${MTO_FIELD_PASSWORD:?falta en .env, copiese .env.example}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Cache de las dos aplicaciones. No guarda nada que no este en PostgreSQL: con
  # APP_CACHE_ENABLED=false las aplicaciones funcionan igual, solo que consultando siempre la base.
  #
  # maxmemory-policy no es un ajuste fino: con el valor por defecto (noeviction) un Redis lleno
  # rechaza toda escritura con un error de memoria, y quedaria una cache que ya no cachea y que no
  # se recupera sola. Con allkeys-lru tira lo que menos se usa, que es lo que se espera de una cache.
  redis:
    image: redis:7.4-alpine
    container_name: mto-redis
    restart: unless-stopped
    command: >-
      redis-server
      --requirepass ${REDIS_PASSWORD:?falta en .env, copiese .env.example}
      --maxmemory ${REDIS_MAXMEMORY:-256mb}
      --maxmemory-policy allkeys-lru
      --appendonly no
      --save 300 1
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?falta en .env, copiese .env.example}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    # El volumen no es durabilidad -una cache perdida se rellena sola-, sino evitar el arranque en
    # frio tras un 'docker compose restart'.
    volumes:
      - redis_data:/data
    # Un socket abierto en el 6379 no dice que Redis acepte comandos: con requirepass, un PING sin
    # autenticar responde error. Se sondea autenticado.
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # EL broker, en singular. mto-configuration publica los eventos de datos maestros aqui y
  # mto-stock y mto-maintenance los consumen de aqui. Las dos aplicaciones usan el mismo usuario: repartir
  # credenciales por servicio es una decision de explotacion, no del entorno local.
  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: mto-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-mto}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?falta en .env, copiese .env.example}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    # Un socket abierto en el 5672 no significa que el broker acepte ya declaraciones: se sondea
    # con rabbitmq-diagnostics, que es lo que responde cuando el nodo esta de verdad listo.
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Keycloak 26 usa hostname v2: el puerto va dentro de la URL de --hostname, no en un
  # --hostname-port aparte. Con la URL completa, el modo estricto (el de por defecto) es justo lo
  # que se quiere: fija el 'iss' de los tokens a http://auth.mto.local:8082 sea cual sea la
  # cabecera Host de la peticion. Un emisor que variase segun quien llama no coincidiria con
  # KEYCLOAK_ISSUER_URI y la validacion fallaria.
  #
  # --import-realm carga /opt/keycloak/data/import al arrancar. Eso deja el realm BASE: los
  # clientes y roles de cada servicio los aporta su importacion parcial, que aplica
  # keycloak/apply-partials.sh una vez el servidor esta arriba. Ver README.md.
  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    container_name: mto-keycloak
    restart: unless-stopped
    command: start-dev --hostname=http://auth.mto.local:${KEYCLOAK_PORT:-8082} --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?falta en .env, copiese .env.example}
      KC_HTTP_ENABLED: "true"
      # Habilita /health/ready en el puerto de management (9000), que es lo unico que dice de
      # verdad si Keycloak ya sirve el realm.
      KC_HEALTH_ENABLED: "true"
    # Se monta la variante local y no mto-realm.json: la local trae sslRequired en none y el
    # password grant de mto-frontend abierto. mto-realm.json es la definicion de referencia para
    # entornos desplegados y no debe traer ni una cosa ni la otra. Los secretos fijos de desarrollo
    # no van en ninguna de las dos: los ponen los -dev.json de cada servicio (apply-partials.sh).
    volumes:
      - ./keycloak/mto-realm-local.json:/opt/keycloak/data/import/mto-realm-local.json:ro
    ports:
      - "${KEYCLOAK_PORT:-8082}:8080"
      - "${KEYCLOAK_MANAGEMENT_PORT:-9000}:9000"
    # Un socket abierto en el 8080 no significa que el realm este disponible: Keycloak acepta
    # conexiones bastante antes de servir el JWK Set, y las aplicaciones arrancarian contra un
    # Keycloak que todavia no responde. Se sondea /health/ready en el puerto de management.
    #
    # Escalar de bloque, no cadena entre comillas: el comando lleva comillas dobles y simples, y
    # entrecomillarlo en linea obliga a escaparlas hasta hacerlo ilegible. Los \r\n llegan
    # literales a printf, que es quien los convierte en el CRLF que exige HTTP.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/localhost/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 5s
      timeout: 5s
      retries: 40
      # Keycloak tarda en la primera arrancada (migracion de esquema); sin esto los primeros
      # sondeos cuentan como fallo.
      start_period: 30s

  # Colector de trazas y visor, todo en uno. Jaeger habla OTLP nativo, asi que no hace falta un
  # OpenTelemetry Collector delante. Uno solo para los tres servicios: una traza que empieza en el
  # gateway y termina en mto-stock, saltando por la cola de RabbitMQ, se ve entera en un solo sitio.
  jaeger:
    # El tag lleva los TRES numeros. 'jaegertracing/all-in-one:1.62' no existe y nunca ha
    # existido —los tags publicados son 1.62.0, 1.63.0...—, asi que este compose no podia
    # levantarse entero: 'docker compose up' fallaba al resolver la referencia y de paso
    # interrumpia la descarga de las tres imagenes de aplicacion, que quedaban a medias y
    # daban un 'No such image' que parecia otro problema distinto.
    image: jaegertracing/all-in-one:1.62.0
    container_name: mto-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
      - "${JAEGER_OTLP_HTTP_PORT:-4318}:4318"
      - "${JAEGER_OTLP_GRPC_PORT:-4317}:4317"
    # Sin volumen a proposito: las trazas de desarrollo viven en memoria y se pierden al parar el
    # contenedor. Persistirlas pediria Elasticsearch o Cassandra detras, mucho aparato para mirar
    # una traza mientras se depura.
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:16686"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Todo el correo del entorno local acaba aqui y se lee en http://localhost:8025; nada sale fuera.
  # Lo usan mto-notification (los avisos urgentes) y el propio Keycloak (el correo de acciones:
  # contrasena temporal, verificar email), cuyo smtpServer apunta a este servicio en
  # mto-realm-local.json. Sin perfil, como el resto de la infraestructura: sin SMTP el correo de
  # acciones de mto-users fallaba con un 502 y nada avisaba.
  mailpit:
    image: axllent/mailpit:v1.27
    container_name: mto-mailpit
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ---------------------------------------------------------------------------------------------
  # Aplicaciones. Cada una con su perfil, ninguna arranca sin pedirla.
  # ---------------------------------------------------------------------------------------------

  configuration:
    image: ghcr.io/alexwarrior1991/mto-configuration:${MTO_CONFIGURATION_TAG:-latest}
    container_name: mto-configuration
    profiles: [all, configuration]
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MTO_CONFIGURATION_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${MTO_CONFIGURATION_DB:-mto_configuration_db}
      MTO_CONFIGURATION_DATASOURCE_USERNAME: ${MTO_CONFIGURATION_USER:-mto_configuration_user}
      MTO_CONFIGURATION_DATASOURCE_PASSWORD: ${MTO_CONFIGURATION_PASSWORD:?falta en .env, copiese .env.example}
      MTO_CONFIGURATION_DB_SCHEMA: ${MTO_CONFIGURATION_SCHEMA:-mto_configuration}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?falta en .env, copiese .env.example}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-mto}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?falta en .env, copiese .env.example}
      SPRING_RABBITMQ_VIRTUAL_HOST: ${RABBITMQ_VHOST:-/}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://otel.mto.local:4318/v1/traces}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-http://auth.mto.local:8082/realms/mto}
      KEYCLOAK_CLIENT_ID: mto-configuration-api
      KEYCLOAK_AUDIENCE: mto-configuration-api
      KEYCLOAK_SERVICE_CLIENT_SECRET: ${KEYCLOAK_SERVICE_CLIENT_SECRET:?falta en .env, copiese .env.example}
      # Los ficheros de los trabajos: el CSV de una exportacion y el informe de una importacion. Por
      # defecto son rutas relativas al directorio de trabajo de la imagen (/app), que es de root, y el
      # usuario con el que corre no puede crear nada alli: el trabajo terminaba sin su fichero y
      # descargarlo fallaba. Donde dejarlos es configuracion del entorno; aqui, /tmp del contenedor.
      # Se pierden al recrearlo, y el servicio responde entonces 410: hay que relanzar el trabajo.
      APP_JOBS_PROFILE_EXPORT_DIRECTORY: /tmp/mto-configuration/exports
      APP_JOBS_PROFILE_IMPORT_REPORT_DIRECTORY: /tmp/mto-configuration/profile-imports
      APP_JOBS_LOV_REPORT_DIRECTORY: /tmp/mto-configuration/lov-imports
    extra_hosts:
      - "auth.mto.local:host-gateway"
      - "otel.mto.local:host-gateway"
    ports:
      - "${MTO_CONFIGURATION_PORT:-8081}:8080"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      keycloak: {condition: service_healthy}

  stock:
    image: ghcr.io/alexwarrior1991/mto-stock:${MTO_STOCK_TAG:-latest}
    container_name: mto-stock
    profiles: [all, stock]
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${MTO_STOCK_SPRING_PROFILE:-prod}
      SERVER_PORT: 8080
      DATABASE_URL: jdbc:postgresql://postgres:5432/${MTO_STOCK_DB:-mto_stock}
      DATABASE_USERNAME: ${MTO_STOCK_USER:-mto_stock_user}
      DATABASE_PASSWORD: ${MTO_STOCK_PASSWORD:?falta en .env, copiese .env.example}
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?falta en .env, copiese .env.example}
      SPRING_DATA_REDIS_DATABASE: 0
      APP_CACHE_ENABLED: "true"
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-mto}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?falta en .env, copiese .env.example}
      SPRING_RABBITMQ_VIRTUAL_HOST: ${RABBITMQ_VHOST:-/}
      APP_RABBITMQ_ENABLED: "true"
      APP_RABBITMQ_MASTER_DATA_LISTENER_ENABLED: "true"
      # Continua la traza que llega en las cabeceras del mensaje de RabbitMQ.
      SPRING_RABBITMQ_LISTENER_OBSERVATION_ENABLED: "true"
      # El mismo valor que en mto-configuration. Vacio por defecto: repartir un secreto es una
      # decision de explotacion, y con OPTIONAL un mensaje sin firma verificable sigue pasando.
      MESSAGING_SIGNATURE_SECRET: ${MESSAGING_SIGNATURE_SECRET:-}
      MESSAGING_SIGNATURE_MODE: ${MESSAGING_SIGNATURE_MODE:-OPTIONAL}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://otel.mto.local:4318/v1/traces}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-http://auth.mto.local:8082/realms/mto}
      KEYCLOAK_CLIENT_ID: mto-stock-api
      KEYCLOAK_AUDIENCE: mto-stock-api
      KEYCLOAK_AUDIENCE_VALIDATION_ENABLED: "true"
      APP_SECURITY_EXPOSE_API_DOCS: ${APP_SECURITY_EXPOSE_API_DOCS:-true}
      MANAGEMENT_HEALTH_RABBIT_ENABLED: "false"
      MANAGEMENT_HEALTH_REDIS_ENABLED: "false"
    extra_hosts:
      - "auth.mto.local:host-gateway"
      - "otel.mto.local:host-gateway"
    ports:
      - "${MTO_STOCK_PORT:-8080}:8080"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      keycloak: {condition: service_healthy}

  # Mantenimiento de catenaria. Sin Redis: no cachea nada. Consume los eventos de datos maestros
  # (perfiles, seccionadores y aisladores de seccion se convierten en activos) y LLAMA a mto-stock
  # para reservar y consumir material, con la cuenta de servicio mto-maintenance-svc. Por eso su
  # perfil habitual va con el de stock: sin mto-stock arranca igual, pero cada reserva queda en
  # FAILED hasta que se reintente con .../materials/{id}/sync.
  maintenance:
    image: ghcr.io/alexwarrior1991/mto-maintenance:${MTO_MAINTENANCE_TAG:-latest}
    container_name: mto-maintenance
    profiles: [all, maintenance]
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${MTO_MAINTENANCE_SPRING_PROFILE:-prod}
      SERVER_PORT: 8080
      DATABASE_URL: jdbc:postgresql://postgres:5432/${MTO_MAINTENANCE_DB:-mto_maintenance}
      DATABASE_USERNAME: ${MTO_MAINTENANCE_USER:-mto_maintenance_user}
      DATABASE_PASSWORD: ${MTO_MAINTENANCE_PASSWORD:?falta en .env, copiese .env.example}
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-mto}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?falta en .env, copiese .env.example}
      SPRING_RABBITMQ_VIRTUAL_HOST: ${RABBITMQ_VHOST:-/}
      APP_RABBITMQ_ENABLED: "true"
      APP_RABBITMQ_MASTER_DATA_LISTENER_ENABLED: "true"
      SPRING_RABBITMQ_LISTENER_OBSERVATION_ENABLED: "true"
      MESSAGING_SIGNATURE_SECRET: ${MESSAGING_SIGNATURE_SECRET:-}
      MESSAGING_SIGNATURE_MODE: ${MESSAGING_SIGNATURE_MODE:-OPTIONAL}
      # mto-stock por nombre de servicio: los dos corren en esta red. Si stock se arranca desde el
      # IDE, apuntese al host (MTO_STOCK_URL=http://host.docker.internal:8080 en .env).
      APP_STOCK_ENABLED: "true"
      MTO_STOCK_URL: ${MTO_STOCK_URL:-http://stock:8080}
      # La cuenta de servicio pide su token al mismo emisor que valida los de los usuarios.
      KEYCLOAK_TOKEN_URI: ${KEYCLOAK_ISSUER_URI:-http://auth.mto.local:8082/realms/mto}/protocol/openid-connect/token
      KEYCLOAK_SERVICE_CLIENT_ID: mto-maintenance-svc
      KEYCLOAK_SERVICE_CLIENT_SECRET: ${MTO_MAINTENANCE_SERVICE_CLIENT_SECRET:?falta en .env, copiese .env.example}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://otel.mto.local:4318/v1/traces}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-http://auth.mto.local:8082/realms/mto}
      KEYCLOAK_CLIENT_ID: mto-maintenance-api
      KEYCLOAK_AUDIENCE: mto-maintenance-api
      KEYCLOAK_AUDIENCE_VALIDATION_ENABLED: "true"
      APP_SECURITY_EXPOSE_API_DOCS: ${APP_SECURITY_EXPOSE_API_DOCS:-true}
      MANAGEMENT_HEALTH_RABBIT_ENABLED: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "auth.mto.local:host-gateway"
      - "otel.mto.local:host-gateway"
    ports:
      - "${MTO_MAINTENANCE_PORT:-8083}:8080"
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      keycloak: {condition: service_healthy}

  # La consola en directo del bloqueo de via: un servidor gRPC (9090 dentro, 9094 en el host) al que
  # los dispositivos de los equipos y el responsable llegan DIRECTAMENTE. El gateway no participa:
  # es HTTP y no hace de proxy gRPC. Actuator sigue por HTTP (8080 dentro, 8087 en el host).
  # Llama a mto-maintenance para leer los turnos de una posesion y contarle el inicio y el fin de
  # cada tarea, con la cuenta de servicio mto-field-svc (sus roles maintenance-read y
  # maintenance-write los concede apply-partials.sh): por eso se levanta con el perfil
  # maintenance. Con MTO_FIELD_MAINTENANCE_ENABLED=false el cliente va apagado: cualquier id de
  # turno vale, el servicio inventa el equipo y las tareas quedan pendientes (para probar el canal
  # sin mantenimiento). Sin depends_on de maintenance a proposito: esta en otro perfil, y un
  # depends_on obligatorio rompe 'docker compose --profile field config'.
  #
  # Lleva 'build' ademas de 'image', como el backoffice: hasta que su CI publique la imagen en GHCR,
  # compose la construye desde el checkout hermano (../mto-field).
  field:
    image: ghcr.io/alexwarrior1991/mto-field:${MTO_FIELD_TAG:-latest}
    build:
      context: ../mto-field
    container_name: mto-field
    profiles: [all, field]
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${MTO_FIELD_SPRING_PROFILE:-prod}
      SERVER_PORT: 8080
      SPRING_GRPC_SERVER_PORT: 9090
      DATABASE_URL: jdbc:postgresql://postgres:5432/${MTO_FIELD_DB:-mto_field}
      DATABASE_USERNAME: ${MTO_FIELD_USER:-mto_field_user}
      DATABASE_PASSWORD: ${MTO_FIELD_PASSWORD:?falta en .env, copiese .env.example}
      SPRING_FLYWAY_ENABLED: "true"
      # mto-maintenance por nombre de servicio: los dos corren en esta red. Si se arranca desde el
      # IDE, apuntese al host (MTO_MAINTENANCE_URL=http://host.docker.internal:8083 en .env).
      APP_MAINTENANCE_ENABLED: ${MTO_FIELD_MAINTENANCE_ENABLED:-true}
      MTO_MAINTENANCE_URL: ${MTO_MAINTENANCE_URL:-http://maintenance:8080}
      # La cuenta de servicio pide su token al mismo emisor que valida los de los usuarios.
      KEYCLOAK_TOKEN_URI: ${KEYCLOAK_ISSUER_URI:-http://auth.mto.local:8082/realms/mto}/protocol/openid-connect/token
      KEYCLOAK_SERVICE_CLIENT_ID: mto-field-svc
      KEYCLOAK_SERVICE_CLIENT_SECRET: ${MTO_FIELD_SERVICE_CLIENT_SECRET:?falta en .env, copiese .env.example}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://otel.mto.local:4318/v1/traces}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-http://auth.mto.local:8082/realms/mto}
      KEYCLOAK_CLIENT_ID: mto-field-api
      KEYCLOAK_AUDIENCE: mto-field-api
      KEYCLOAK_AUDIENCE_VALIDATION_ENABLED: "true"
      # La reflexion es lo que usa grpcurl para listar el servicio; en local se deja encendida.
      SPRING_GRPC_SERVER_REFLECTION_ENABLED: ${MTO_FIELD_GRPC_REFLECTION_ENABLED:-true}
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "auth.mto.local:host-gateway"
      - "otel.mto.local:host-gateway"
    ports:
      - "${MTO_FIELD_PORT:-8087}:8080"
      - "${MTO_FIELD_GRPC_PORT:-9094}:9090"
    depends_on:
      postgres: {condition: service_healthy}
      keycloak: {condition: service_healthy}

  # Administracion de usuarios, roles y perfiles del realm por la Admin API de Keycloak, con la
  # cuenta de servicio mto-users-svc (sus roles de realm-management los concede apply-partials.sh).
  # No tiene base de datos ni broker: todo lo que administra vive en Keycloak.
  users:
    image: ghcr.io/alexwarrior1991/mto-users:${MTO_USERS_TAG:-latest}
    container_name: mto-users
    profiles: [all, users]
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${MTO_USERS_SPRING_PROFILE:-prod}
      SERVER_PORT: 8080
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-http://auth.mto.local:8082/realms/mto}
      KEYCLOAK_USERS_CLIENT_ID: mto-users-api
      KEYCLOAK_AUDIENCE: mto-users-api
      KEYCLOAK_AUDIENCE_VALIDATION_ENABLED: "true"
      # La Admin API se pide al mismo Keycloak que emite los tokens, por el mismo nombre.
      KEYCLOAK_AUTH_SERVER_URL: ${KEYCLOAK_AUTH_SERVER_URL:-http://auth.mto.local:8082}
      KEYCLOAK_REALM: mto
      KEYCLOAK_ADMIN_CLIENT_ID: mto-users-svc
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${MTO_USERS_SERVICE_CLIENT_SECRET:?falta en .env, copiese .env.example}
      # El broker, para publicar quien hizo cada cambio de usuarios hacia mto-notification: en los
      # eventos de administracion de Keycloak el autor es la cuenta de servicio, no la persona.
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-mto}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?falta en .env, copiese .env.example}
      SPRING_RABBITMQ_VIRTUAL_HOST: ${RABBITMQ_VHOST:-/}
      MESSAGING_SIGNATURE_SECRET: ${MESSAGING_SIGNATURE_SECRET:-}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://otel.mto.local:4318/v1/traces}
      APP_SECURITY_EXPOSE_API_DOCS: ${APP_SECURITY_EXPOSE_API_DOCS:-true}
    extra_hosts:
      - "auth.mto.local:host-gateway"
      - "otel.mto.local:host-gateway"
    ports:
      - "${MTO_USERS_PORT:-8084}:8080"
    depends_on:
      rabbitmq: {condition: service_healthy}
      keycloak: {condition: service_healthy}

  # Registro de actividad y notificaciones. Consume los eventos de los demas servicios por el
  # broker, lee los accesos y las mutaciones del realm por la Admin API de Keycloak con la cuenta
  # de servicio mto-notification-svc (sus roles de realm-management y los eventos del realm los
  # pone apply-partials.sh) y manda el correo urgente a Mailpit.
  #
  # Como el backoffice, lleva 'build' ademas de 'image': hasta que su CI publique la imagen en
  # GHCR, compose la construye desde el checkout hermano (../mto-notification).
  notification:
    image: ghcr.io/alexwarrior1991/mto-notification:${MTO_NOTIFICATION_TAG:-latest}
    build:
      context: ../mto-notification
    container_name: mto-notification
    profiles: [all, notification]
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${MTO_NOTIFICATION_SPRING_PROFILE:-prod}
      SERVER_PORT: 8080
      DATABASE_URL: jdbc:postgresql://postgres:5432/${MTO_NOTIFICATION_DB:-mto_notification}
      DATABASE_USERNAME: ${MTO_NOTIFICATION_USER:-mto_notification_user}
      DATABASE_PASSWORD: ${MTO_NOTIFICATION_PASSWORD:?falta en .env, copiese .env.example}
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-mto}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?falta en .env, copiese .env.example}
      SPRING_RABBITMQ_VIRTUAL_HOST: ${RABBITMQ_VHOST:-/}
      APP_RABBITMQ_ENABLED: "true"
      SPRING_RABBITMQ_LISTENER_OBSERVATION_ENABLED: "true"
      MESSAGING_SIGNATURE_SECRET: ${MESSAGING_SIGNATURE_SECRET:-}
      MESSAGING_SIGNATURE_MODE: ${MESSAGING_SIGNATURE_MODE:-OPTIONAL}
      # La Admin API de Keycloak, para leer los eventos; el mismo nombre que emite los tokens.
      KEYCLOAK_AUTH_SERVER_URL: ${KEYCLOAK_AUTH_SERVER_URL:-http://auth.mto.local:8082}
      KEYCLOAK_REALM: mto
      KEYCLOAK_TOKEN_URI: ${KEYCLOAK_ISSUER_URI:-http://auth.mto.local:8082/realms/mto}/protocol/openid-connect/token
      KEYCLOAK_SERVICE_CLIENT_ID: mto-notification-svc
      KEYCLOAK_SERVICE_CLIENT_SECRET: ${MTO_NOTIFICATION_SERVICE_CLIENT_SECRET:?falta en .env, copiese .env.example}
      # El correo, a Mailpit por su nombre de servicio.
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: 1025
      APP_NOTIFICATION_LINK_BASE_URL: ${APP_NOTIFICATION_LINK_BASE_URL:-http://localhost:8085}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://otel.mto.local:4318/v1/traces}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-http://auth.mto.local:8082/realms/mto}
      KEYCLOAK_CLIENT_ID: mto-notification-api
      KEYCLOAK_AUDIENCE: mto-notification-api
      KEYCLOAK_AUDIENCE_VALIDATION_ENABLED: "true"
      APP_SECURITY_EXPOSE_API_DOCS: ${APP_SECURITY_EXPOSE_API_DOCS:-true}
      MANAGEMENT_HEALTH_RABBIT_ENABLED: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "auth.mto.local:host-gateway"
      - "otel.mto.local:host-gateway"
    ports:
      - "${MTO_NOTIFICATION_PORT:-8086}:8080"
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      keycloak: {condition: service_healthy}
      mailpit: {condition: service_healthy}

  # El borde: aqui nace la traza distribuida y aqui se autentica. No persiste nada, asi que no
  # depende de la infraestructura de datos.
  #
  # Los destinos van por nombre de servicio de compose porque los cinco corren en la misma red. Si
  # se para una aplicacion para arrancarla desde el IDE, hay que apuntar su URL al host: vease
  # MTO_CONFIGURATION_URL / MTO_STOCK_URL en .env.example.
  gateway:
    image: ghcr.io/alexwarrior1991/mto-gateway:${MTO_GATEWAY_TAG:-latest}
    container_name: mto-gateway
    profiles: [all, gateway]
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8090
      MTO_CONFIGURATION_URL: ${MTO_CONFIGURATION_URL:-http://configuration:8080}
      MTO_STOCK_URL: ${MTO_STOCK_URL:-http://stock:8080}
      MTO_MAINTENANCE_URL: ${MTO_MAINTENANCE_URL:-http://maintenance:8080}
      MTO_USERS_URL: ${MTO_USERS_URL:-http://users:8080}
      MTO_NOTIFICATION_URL: ${MTO_NOTIFICATION_URL:-http://notification:8080}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-http://auth.mto.local:8082/realms/mto}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://otel.mto.local:4318/v1/traces}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://localhost:5173}
    # host.docker.internal no existe en Linux salvo que se declare; hace falta si se apunta
    # MTO_CONFIGURATION_URL, MTO_STOCK_URL, MTO_MAINTENANCE_URL, MTO_USERS_URL o MTO_NOTIFICATION_URL a un
    # servicio arrancado desde el IDE.
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "auth.mto.local:host-gateway"
      - "otel.mto.local:host-gateway"
    ports:
      - "${MTO_GATEWAY_PORT:-8090}:8090"
    depends_on:
      keycloak: {condition: service_healthy}

  # El backoffice (Vaadin), una de las dos aplicaciones web del dominio; la otra es la SPA de abajo,
  # con las mismas pantallas y las mismas rutas, y las dos se usan indistintamente. No persiste nada:
  # solo necesita Keycloak para el login y el gateway, al que habla servidor a servidor con el token
  # de la persona.
  #
  # Lleva 'build' ademas de 'image' a proposito: hasta que la imagen exista en GHCR (la publica
  # el CI de mto-backoffice al fusionar en master), compose la construye desde el checkout hermano
  # (../mto-backoffice) y '--profile all' sigue funcionando. Cuando exista,
  # 'docker compose pull backoffice' la trae y 'up' deja de construir.
  backoffice:
    image: ghcr.io/alexwarrior1991/mto-backoffice:${MTO_BACKOFFICE_TAG:-latest}
    build:
      context: ../mto-backoffice
    container_name: mto-backoffice
    profiles: [all, backoffice]
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${MTO_BACKOFFICE_SPRING_PROFILE:-prod}
      SERVER_PORT: 8080
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-http://auth.mto.local:8082/realms/mto}
      KEYCLOAK_CLIENT_ID: mto-backoffice
      # El secreto del cliente de login 'mto-backoffice'; en local, el de mto-backoffice-dev.json.
      KEYCLOAK_CLIENT_SECRET: ${MTO_BACKOFFICE_CLIENT_SECRET:?falta en .env, copiese .env.example}
      # El gateway por su nombre de servicio. Si el gateway se arranca desde el IDE, apuntese a
      # http://host.docker.internal:8090.
      MTO_GATEWAY_URL: ${MTO_GATEWAY_URL:-http://gateway:8090}
      # 'Abrir en mto-frontend', en la barra, lleva a la misma pantalla en la SPA, tal como la ve el
      # navegador.
      MTO_FRONTEND_URL: ${MTO_FRONTEND_PUBLIC_URL:-http://localhost:4200}
    # El 'iss' de los tokens es http://auth.mto.local:8082 y el navegador entra a Keycloak por ese
    # mismo nombre: la aplicacion tiene que resolverlo igual que el host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "auth.mto.local:host-gateway"
    ports:
      # 8085 no es libre: es el redirect URI del cliente en el realm.
      - "${MTO_BACKOFFICE_PORT:-8085}:8080"
    depends_on:
      keycloak: {condition: service_healthy}

  # La SPA (React), la otra aplicacion web: las mismas pantallas, rutas y reglas que el backoffice, y
  # las dos se usan indistintamente. nginx sirve la aplicacion y reenvia /api al gateway por el mismo
  # origen, sin Origin. El navegador entra por Keycloak con el cliente publico mto-frontend; nginx
  # nunca habla con Keycloak, por eso no lleva extra_hosts.
  #
  # Entra en 'all' junto al backoffice, cada uno en su puerto. Para desarrollar la SPA con
  # 'npm run dev', que tambien usa el 4200 (es el redirect URI de su cliente), parese antes este
  # contenedor: 'docker compose stop frontend'.
  #
  # Sin depends_on a proposito: el gateway esta en otro perfil y un depends_on obligatorio rompe
  # 'docker compose --profile frontend config'. nginx resuelve el gateway en cada peticion, asi que
  # arranca aunque el gateway no este y responde 503 hasta que llegue.
  #
  # Lleva 'build' ademas de 'image', como el backoffice: hasta que la imagen exista en GHCR (la
  # publica el CI de mto-frontend al fusionar en master), compose la construye desde ../mto-frontend.
  frontend:
    image: ghcr.io/alexwarrior1991/mto-frontend:${MTO_FRONTEND_TAG:-latest}
    build:
      context: ../mto-frontend
    container_name: mto-frontend
    profiles: [all, frontend]
    restart: unless-stopped
    environment:
      # El realm tal como lo ve el navegador (el 'iss' de los tokens).
      MTO_OIDC_AUTHORITY: ${KEYCLOAK_ISSUER_URI:-http://auth.mto.local:8082/realms/mto}
      MTO_OIDC_CLIENT_ID: mto-frontend
      # El gateway por su nombre de servicio. Si el gateway se arranca desde el IDE, nginx no lo
      # encontraria por host.docker.internal (su resolver no lee /etc/hosts): arranquese la SPA con
      # 'npm run dev', que llega al gateway del host.
      MTO_GATEWAY_URL: http://gateway:8090
      MTO_ENVIRONMENT: local
      # 'Abrir en el backoffice', en la barra, lleva a la misma pantalla en el backoffice.
      MTO_BACKOFFICE_URL: ${MTO_BACKOFFICE_PUBLIC_URL:-http://localhost:8085}
    ports:
      # 4200 no es libre: es el redirect URI del cliente mto-frontend en el realm. Ni a la vez que
      # 'npm run dev'.
      - "${MTO_FRONTEND_PORT:-4200}:8080"

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
