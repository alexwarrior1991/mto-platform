{{- if .Values.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "mto-service.name" . }}-data
  labels:
    {{- include "mto-service.labels" . | nindent 4 }}
  annotations:
    # Un PVC con datos no se borra al quitar la aplicacion de Argo CD.
    argocd.argoproj.io/sync-options: Delete=false
spec:
  accessModes:
    - {{ .Values.persistence.accessMode }}
  {{- with .Values.persistence.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
